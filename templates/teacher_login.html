{% extends "base.html" %}

{% block title %}Teacher Login - REC Student Management{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-header">
        <img src="{{ url_for('static', filename='images/rec-logo.png') }}" alt="REC Logo" class="login-logo">
        <h1>Rajalakshmi Engineering College</h1>
        <p>Student Management System</p>
    </div>

    <!-- Login Forms -->
    <div id="loginForms">
        <!-- Teacher Login Form -->
        <div id="teacherLoginForm" class="login-form-container">
            <div class="form-header">
                <h2><i class="fas fa-chalkboard-teacher"></i> Teacher Login</h2>
                <a href="{{ url_for('home') }}" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            </div>
            
            {% if msg %}
            <div class="alert alert-danger">{{ msg }}</div>
            {% endif %}

            <form id="teacherForm" class="login-form" action="{{ url_for('teacher_login') }}" method="POST">
                <div class="form-group">
                    <label for="teacherId">Teacher ID</label>
                    <input type="text" id="teacherId" name="username" class="form-control" placeholder="Enter teacher ID" required value="TREC001">
                </div>
                <div class="form-group">
                    <label for="teacherPassword">Password</label>
                    <input type="password" id="teacherPassword" name="password" class="form-control" placeholder="Enter password" required value="teacher123">
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Login as Teacher
                </button>
            </form>
        </div>
    </div>

    <div class="login-footer">
        <a href="{{ url_for('home') }}" class="home-link">
            <i class="fas fa-home"></i> Back to Home
        </a>
    </div>
</div>

<style>
    .login-container {
        max-width: 500px;
        margin: 50px auto;
        padding: 30px;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .login-logo {
        width: 80px;
        margin-bottom: 15px;
    }

    .login-header h1 {
        font-size: 24px;
        color: #491a7e;
        margin-bottom: 5px;
    }

    .login-header p {
        color: #666;
        margin-bottom: 30px;
    }

    .login-form-container {
        display: block;
    }

    .form-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid #eee;
        padding-bottom: 15px;
    }

    .form-header h2 {
        font-size: 22px;
        color: #491a7e;
        margin: 0;
    }

    .form-header h2 i {
        margin-right: 10px;
    }

    .back-btn {
        background: none;
        border: 1px solid #ddd;
        color: #666;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        text-decoration: none;
    }

    .login-form {
        text-align: left;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
    }

    .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
    }

    .btn-login {
        width: 100%;
        padding: 15px;
        background-color: #e64a19;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .btn-login:hover {
        background-color: #c0411a;
    }

    .btn-login i {
        margin-right: 8px;
    }

    .login-footer {
        margin-top: 20px;
        font-size: 14px;
    }

    .home-link {
        color: #491a7e;
        text-decoration: none;
    }

    .alert {
        padding: 15px;
        margin-bottom: 20px;
        border: 1px solid transparent;
        border-radius: 4px;
        color: #a94442;
        background-color: #f2dede;
        border-color: #ebccd1;
        text-align: center;
    }
</style>
{% endblock %}
